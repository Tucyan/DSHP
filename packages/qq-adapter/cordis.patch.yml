# Applied by DSH profile wiring after opt-in installation.
- insert:
    - id: im-qqbot
      name: '@tencent-connect/dsh-qqbot'
      config:
        appId: __FROM_ENV__
        appSecret: __FROM_ENV__
        access:
          c2cMode: allowlist
          c2cAllow: []
          groupMode: disabled
          groupAllow: []
        requireMention: true
        debug: false
